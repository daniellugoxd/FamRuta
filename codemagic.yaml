Workflows:
  android-apk:
    name: Build Android APK (FamRuta)[span_1](start_span)[span_1](end_span)
    max_build_duration: 30
    instance_type: linux
    environment:
      java: 17[span_2](start_span)[span_2](end_span)
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Make gradlew executable
        script: |
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/**/*.apk
